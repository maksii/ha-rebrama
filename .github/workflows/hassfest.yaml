name: Validate with hassfest

# No `schedule` here on purpose: GitHub disables a workflow that has one after
# 60 days without commits, and that would silently drop this check from pull
# requests too. Scheduled runs live in scheduled.yaml, which calls this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
