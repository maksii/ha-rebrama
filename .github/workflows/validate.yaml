name: HACS validation

# No `schedule` here on purpose: GitHub disables a workflow that has one after
# 60 days without commits, and that would silently drop this check from pull
# requests too. Scheduled runs live in scheduled.yaml, which calls this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # Brand images are shipped locally in custom_components/rebrama/brand/
          # (Home Assistant 2026.3+ brands proxy). Until the `rebrama` domain is
          # also accepted into the home-assistant/brands repository, skip the
          # remote brands check so CI stays green for the custom-repository path.
          ignore: brands
