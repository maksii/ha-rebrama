name: Tests

# No `schedule` here on purpose: GitHub disables a workflow that has one after
# 60 days without commits, and that would silently drop these checks from pull
# requests too. Scheduled runs live in scheduled.yaml, which calls this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.3+ (and therefore the current test harness)
          # requires Python 3.14; an older interpreter silently resolves to an
          # old Home Assistant release.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest
