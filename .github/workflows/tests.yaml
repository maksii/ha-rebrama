name: Tests

# No `schedule` here on purpose: GitHub disables a workflow that has one after
# 60 days without commits, and that would silently drop these checks from pull
# requests too. Scheduled runs live in scheduled.yaml, which calls this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: pip install -r requirements_dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Strict typing
        run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.8.0"
            harness: "0.13.354"
          - ha: "2026.10.4"
            harness: "0.13.375"
          - ha: latest
            harness: latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Home Assistant 2026.3+ (and therefore the current test harness)
          # requires Python 3.14; an older interpreter silently resolves to an
          # old Home Assistant release.
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha }}" = "latest" ]; then
            pip install pytest-homeassistant-custom-component pytest-cov==7.1.0
          else
            pip install "homeassistant==${{ matrix.ha }}" "pytest-homeassistant-custom-component==${{ matrix.harness }}" pytest-cov==7.1.0
          fi
      - name: Run tests
        run: pytest
